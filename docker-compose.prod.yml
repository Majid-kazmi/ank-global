version: '3.8'

# =================================================================
# ANK GLOBAL CORPORATE PLATFORM - PRODUCTION COOLIFY DOCKER STACK
# Optimized for Hetzner Cloud VPS (CPX32: 4 vCPU, 8 GB RAM)
# Coexists cleanly alongside SaveDownloads and Gaaon Se Shehr Tak
# =================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ankglobal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ankglobal_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ankglobal_net

  redis:
    image: redis:7-alpine
    container_name: ankglobal_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ankglobal_redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - ankglobal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ankglobal_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://ankglobal.co}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-info@ankglobal.co}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - ankglobal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.ankglobal.co/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ankglobal.co}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-971552138281}
        NEXT_PUBLIC_PHONE_NUMBER: ${NEXT_PUBLIC_PHONE_NUMBER:-"+971 55 213 8281"}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: ankglobal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.ankglobal.co/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ankglobal.co}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - ankglobal_net

volumes:
  ankglobal_pgdata:
    name: ankglobal_production_pgdata
  ankglobal_redisdata:
    name: ankglobal_production_redisdata

networks:
  ankglobal_net:
    name: ankglobal_production_network
    driver: bridge
