# =========================================================
# ANK GLOBAL - NGINX REVERSE PROXY CONFIGURATION
# Production Deployment with SSL / Cloudflare Edge Support
# =========================================================

upstream ankglobal_frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream ankglobal_backend_upstream {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name ankglobal.co www.ankglobal.co;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ankglobal.co www.ankglobal.co;

    # SSL Certificates (managed by Coolify / Let's Encrypt / Cloudflare Origin)
    ssl_certificate /etc/nginx/ssl/live/ankglobal.co/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ankglobal.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    client_max_body_size 20M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://ankglobal_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Frontend Next.js Proxy
    location / {
        proxy_pass http://ankglobal_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
